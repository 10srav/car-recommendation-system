{% extends "base.html" %}

{% block title %}List Your Car - Auto Marketplace{% endblock %}

{% block content %}
<div class="container my-5">
    <div class="row">
        <div class="col-lg-8 mx-auto">
            <h1 class="mb-4 text-center">List Your Car for Sale</h1>
            <p class="text-center mb-4">Fill in the details to list your car on our marketplace</p>

            <div class="card shadow">
                <div class="card-body p-4">
                    <form method="POST" action="{{ url_for('main.list_car') }}">
                        <h5 class="mb-3">Basic Information</h5>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Brand *</label>
                                <input type="text" class="form-control" name="brand" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Model *</label>
                                <input type="text" class="form-control" name="model" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Variant *</label>
                                <input type="text" class="form-control" name="variant" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Body Type *</label>
                                <select class="form-select" name="body_type" required>
                                    <option value="Hatchback">Hatchback</option>
                                    <option value="Sedan">Sedan</option>
                                    <option value="SUV">SUV</option>
                                    <option value="MPV">MPV</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Color *</label>
                                <input type="text" class="form-control" name="color" required>
                            </div>
                        </div>

                        <hr>
                        <h5 class="mb-3">Technical Details</h5>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Registration Year *</label>
                                <input type="number" class="form-control" name="registration_year" min="2005" max="2024" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Fuel Type *</label>
                                <select class="form-select" name="fuel_type" required>
                                    <option value="Petrol">Petrol</option>
                                    <option value="Diesel">Diesel</option>
                                    <option value="CNG">CNG</option>
                                    <option value="Electric">Electric</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Transmission *</label>
                                <select class="form-select" name="transmission" required>
                                    <option value="Manual">Manual</option>
                                    <option value="Automatic">Automatic</option>
                                    <option value="AMT">AMT</option>
                                </select>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Mileage (km) *</label>
                                <input type="number" class="form-control" name="mileage_km" required>
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Owners *</label>
                                <input type="number" class="form-control" name="num_owners" min="1" max="5" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-4">
                                <label class="form-label">Seating Capacity</label>
                                <input type="number" class="form-control" name="seating_capacity" value="5">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Engine CC</label>
                                <input type="number" class="form-control" name="engine_cc" value="1200">
                            </div>
                            <div class="col-md-4">
                                <label class="form-label">Fuel Efficiency (km/l)</label>
                                <input type="number" step="0.1" class="form-control" name="fuel_efficiency_kmpl" value="15">
                            </div>
                        </div>

                        <hr>
                        <h5 class="mb-3">Pricing & History</h5>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Original Price (₹) *</label>
                                <input type="number" class="form-control" name="original_price" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Asking Price (₹) *</label>
                                <input type="number" class="form-control" name="current_price" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Service History *</label>
                                <select class="form-select" name="service_history" required>
                                    <option value="Complete">Complete</option>
                                    <option value="Partial">Partial</option>
                                    <option value="Unknown">Unknown</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Accident History *</label>
                                <select class="form-select" name="accident_history" required>
                                    <option value="No">No Accidents</option>
                                    <option value="Minor">Minor Accidents</option>
                                    <option value="Major">Major Accidents</option>
                                </select>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Insurance Validity (months)</label>
                                <input type="number" class="form-control" name="insurance_validity_months" min="0" max="12" value="6">
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">RTO Code *</label>
                                <input type="text" class="form-control" name="rto" placeholder="e.g., MH01" required>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">City *</label>
                            <input type="text" class="form-control" name="city" required>
                        </div>

                        <div class="mb-3">
                            <label class="form-label">Features</label>
                            <textarea class="form-control" name="features" rows="2" placeholder="AC, Power Windows, ABS, etc."></textarea>
                        </div>

                        <hr>
                        <h5 class="mb-3">Your Contact Information</h5>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Your Name *</label>
                                <input type="text" class="form-control" name="seller_name" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Phone Number *</label>
                                <input type="tel" class="form-control" name="seller_phone" placeholder="+91-9999999999" required>
                            </div>
                        </div>

                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label">Price Negotiable?</label>
                                <select class="form-select" name="negotiable">
                                    <option value="No">No (Fixed Price)</option>
                                    <option value="Yes">Yes (Negotiable)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label">Test Drive Available?</label>
                                <select class="form-select" name="test_drive_available">
                                    <option value="Yes">Yes</option>
                                    <option value="No">No</option>
                                </select>
                            </div>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="bi bi-check-circle"></i> List My Car
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
