# =====================================================
# Docker Compose for Car Recommendation System
# =====================================================
# Usage: docker-compose up -d

version: '3.8'

services:
  web:
    build: .
    container_name: car-recommendation-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-this}
      - DATABASE_URL=sqlite:///automotive_marketplace.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - sqlite_data:/app/instance
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

